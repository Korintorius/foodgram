[flake8]
ignore =
    W503
exclude =
    tests/,
    */migrations/,
    data/
    venv/,
    env/,
    docs/,
    frontend/,
    infra/
per-file-ignores =
    */settings.py:E501
[isort]
line_length = 79
multi_line_output = 3
include_trailing_comma = False
known_first_party = foodgram,ingredients,recipes,tags,users